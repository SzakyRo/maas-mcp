[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "maasmcp"
version = "0.10.1"
description = "MCP server exposing Canonical MAAS bare-metal provisioning to LLM agents."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
authors = [{ name = "The maasmcp authors" }]
keywords = ["maas", "mcp", "model-context-protocol", "bare-metal"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: System Administrators",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: System :: Systems Administration",
]
dependencies = [
  # Wire-format deps: cap major version to prevent accidental breakage.
  # httpx 1.x changes transport internals; mcp 2.x renamed FastMCP to
  # MCPServer (mcp.server.mcpserver) and moved transport knobs to
  # streamable_http_app(). Bump explicitly when ready to migrate.
  "httpx>=0.27,<1.0",
  # Pinned to the 2.1.x line: maas/binding.py's rebind depends on the
  # double-private MCPServer._tool_manager._tools attribute; a minor bump
  # could rename it. rebind_all now fails loudly if the internals move,
  # but the pin keeps that failure theoretical until a deliberate upgrade.
  "mcp[cli]>=2.1,<2.2",
  "pydantic>=2.5",
  "pydantic-settings>=2.1",
  "structlog>=24.1",
  "starlette>=0.36",
  "uvicorn[standard]>=0.27",
  "typer>=0.12",
  "PyYAML>=6.0",
  # typing.TypedDict is rejected by pydantic on Python < 3.12 (the Dockerfile
  # uses 3.11); curated/_schemas imports TypedDict/NotRequired from here.
  "typing-extensions>=4.9",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "pytest-cov>=5.0",
  "respx>=0.21",
  "ruff>=0.5",
  "mypy>=1.10",
  "types-PyYAML",
]

[project.scripts]
maasmcp = "maasmcp.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/maasmcp"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/maasmcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = [
  "-ra",
  "--strict-markers",
  "--strict-config",
  "--cov=maasmcp",
  "--cov-fail-under=80",
  "--cov-report=term-missing",
]
markers = [
  "e2e: end-to-end tests that require a live MAAS (skipped unless MAASMCP_E2E_* env vars are set)",
]
